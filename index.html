<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <title>Gebouwroute App</title>
    <!-- Koppeling naar het CSS-bestand -->
    <script src="internet.js" defer></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- De pop-up overlay -->
    <div id="internetModal" class="overlay">
        <div class="popup">
            <h2>Geen internet toegestaan</h2>
            <p>Zet je Wi-Fi of mobiele data uit om deze pagina te kunnen gebruiken.</p>
            <div class="status-box">
                Status: Je bent ONLINE 🔴
            </div>
        </div>
    </div>

    <!-- De inhoud van je applicatie -->
    <main id="appInhoud">
        <div class="route-builder">
            <h2>Waar ben je?</h2>

            <!-- Stap 1: Verdieping -->
            <div class="stap" id="stap-verdieping">
                <label for="verdiepingSelect">1. Kies de verdieping:</label>
                <select id="verdiepingSelect">
                    <option value="">-- Selecteer Verdieping --</option>
                    <option value="0">Begane grond</option>
                    <option value="1">1e verdieping</option>
                    <option value="2">2e verdieping</option>
                </select>
            </div>

            <!-- Stap 2: Vleugel (standaard verborgen) -->
            <div class="stap" id="stap-vleugel" style="display: none;">
                <p>2. Naar welke vleugel wil je?</p>
                <button class="vleugel-btn" data-vleugel="A">A-vleugel</button>
                <button class="vleugel-btn" data-vleugel="B">B-vleugel</button>
            </div>
        </div>

        <!-- Plattegrond Weergave -->
        <div id="mapContainer">
            <h3 id="plattegrondTitel">Selecteer een verdieping en vleugel</h3>
            <img id="plattegrondImg" src="" alt="Plattegrond" style="display: none; max-width: 100%;">
        </div>

        <!-- Info-paneel voor ruimtes -->
        <div id="vleugelInfo" style="display: none;">
            <h3 id="vleugelTitel"></h3>
            <p id="vleugelBeschrijving"></p>
        </div>
    </main>
</body>
</html>

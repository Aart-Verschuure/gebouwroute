<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <title>Gebouwroute App</title>
    <!-- Koppeling naar het CSS-bestand -->
    <script src="internet.js" defer></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- De pop-up overlay -->
    <div id="internetModal" class="overlay">
        <div class="popup">
            <h2>Geen internet toegestaan</h2>
            <p>Zet je Wi-Fi of mobiele data uit om deze pagina te kunnen gebruiken.</p>
            <div class="status-box">
                Status: Je bent ONLINE 🔴
            </div>
        </div>
    </div>

    <!-- De inhoud van je applicatie -->
    <main id="appInhoud">
        <div>
            <h1>Gebouwroute App</h1>
            <h4>Welkom in deze app. deze app helpt je navigeren door het gebouw.</h4>
        </div>
    
        <div id="demo">

        </div>
    </main>
</body>
</html>
